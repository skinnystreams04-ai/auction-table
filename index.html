<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аукцион - Оверлей V7.0 (Модульный Дашборд)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">

    <style>
        /* ГЛОБАЛЬНЫЙ МРАЧНЫЙ СТИЛЬ И ШРИФТ */
        body { margin: 0; padding: 20px; font-family: 'Neucha', cursive, sans-serif; overflow: hidden; background-color: #0b0d0a; color: #a4b09c; letter-spacing: 0.5px; }
        .layout { display: flex; gap: 20px; align-items: flex-start; height: 95vh; width: 100%; justify-content: space-between; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(10, 14, 10, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #2f382a; border-radius: 4px; }

        /* =========================================
           ЛЕВАЯ ПАНЕЛЬ (ФИКСИРОВАННАЯ ТАБЛИЦА)
           ========================================= */
        .left-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 10px; max-height: 100%; position: relative; }
        
        .table-header { display: flex; align-items: center; background: #0b0d0a; border-bottom: 2px solid #283325; padding-bottom: 8px; margin-bottom: 4px; position: sticky; top: 0; z-index: 10; }
        .th-user { width: 250px; flex-shrink: 0; color: #829c73; font-size: 22px; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }
        .th-games { display: grid; gap: 10px; padding: 0 10px; flex: 1; }
        .th-game { color: #829c73; font-size: 22px; font-weight: 900; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }

        .player-row { display: flex; align-items: stretch; background: linear-gradient(90deg, #121612 0%, #0a0d0a 100%); border: 1px solid #283325; border-left: 4px solid #4a5c41; border-radius: 6px; box-shadow: 2px 2px 8px rgba(0,0,0,0.6); flex-shrink: 0; transition: transform 0.2s; }
        
        .pr-user-info { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 8px 12px; background: rgba(0,0,0,0.3); border-right: 1px solid #283325; width: 250px; flex-shrink: 0; box-sizing: border-box; overflow: hidden; border-radius: 6px 0 0 6px; }
        .pr-role-name { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; width: 100%; }
        .pr-name { font-size: 18px; font-weight: bold; color: #c4d1b8; text-transform: uppercase; text-shadow: 1px 1px 3px #000; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; transition: color 0.2s; }
        .pr-name:hover { color: #8abf86; } 
        .pr-total { font-size: 14px; color: #7c966a; font-weight: bold; background: rgba(124, 150, 106, 0.1); padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(124, 150, 106, 0.2); margin-top: 4px; }
        
        .pr-games { display: grid; gap: 10px; padding: 10px; flex: 1; align-content: start; }
        .pr-game-pill { display: flex; flex-direction: column; background: #161a15; border: 1px solid #2b3628; border-radius: 4px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); overflow: hidden; }
        
        .pr-g-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #283325; background: rgba(0,0,0,0.2); gap: 8px; }
        .pr-g-name-wrap { display: flex; align-items: center; gap: 6px; overflow: hidden; }
        .pr-g-num { display: none; } 
        .pr-g-name { color: #a4b09c; font-size: 16px; font-weight: bold; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
        .pr-g-tix { color: #8bb377; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px #000; line-height: 1; flex-shrink: 0; background: rgba(139, 179, 119, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(139, 179, 119, 0.2); }

        .pr-g-bottom { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; min-height: 20px; }
        .badges-mini-container { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .passive-container { flex-shrink: 0; margin-left: auto; }

        .badge { padding: 2px 5px; font-size: 12px; font-weight: bold; font-family: sans-serif; text-transform: uppercase; background: rgba(5,5,5,0.9); border: 1px solid; border-radius: 3px; box-shadow: inset 0 0 3px rgba(0,0,0,0.9); line-height: 1; }
        .badge.freeze { color: #6e98ad; border-color: #3f5966; } 
        .badge.shield { color: #9c9273; border-color: #5c5541; } 
        .badge.fire   { color: #c97134; border-color: #7a421b; } 
        .badge.passive { color: #8abf86; border-color: #4b6b48; background: rgba(138, 191, 134, 0.1); } 

        .role-badge { font-size: 11px; font-family: sans-serif; font-weight: 900; padding: 2px 4px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); color: #d0d0d0; line-height: 1; flex-shrink: 0; }
        .role-badge.sub { background: #3c2e42; border: 1px solid #574161; } 
        .role-badge.vip { background: #4a242c; border: 1px solid #6b333e; } 
        .role-badge.f   { background: #222b20; border: 1px solid #32422f; } 

        .pr-game-pill.immortal-slot { border-color: #3b5a59; }
        .pr-game-pill.immortal-slot .pr-g-top { background: linear-gradient(90deg, rgba(59, 90, 89, 0.3) 0%, rgba(0, 0, 0, 0.2) 100%); }
        .pr-game-pill.immortal-slot .pr-g-name { color: #7fa6a3; text-shadow: 0 0 5px rgba(127, 166, 163, 0.4); }
        .badge.immortal { background: #1a2626; color: #7fa6a3; border: 1px solid #3b5a59; }

        .pr-game-pill.absolute-slot { border-color: #8c7b52; }
        .pr-game-pill.absolute-slot .pr-g-top { background: linear-gradient(90deg, rgba(140, 123, 82, 0.25) 0%, rgba(0, 0, 0, 0.2) 100%); }
        .pr-game-pill.absolute-slot .pr-g-name { color: #b8a87b; text-shadow: 0 0 5px rgba(184, 168, 123, 0.4); }
        .badge.absolute { background: #2b2518; color: #b8a87b; border: 1px solid #8c7b52; }

        /* =========================================
           ИНТЕРАКТИВНАЯ ЗОНА (МОДУЛИ DRAG & DROP)
           ========================================= */
        .right-interactive { display: flex; gap: 20px; flex: 0 0 790px; height: 100%; }
        .col-main { display: flex; flex-direction: column; gap: 20px; width: 450px; height: 100%; }
        .col-side { display: flex; flex-direction: column; gap: 20px; width: 320px; height: 100%; }

        .drop-zone { flex: 1; display: flex; flex-direction: column; min-height: 50px; border-radius: 6px; transition: all 0.3s; }
        .drop-zone.drag-over { border: 2px dashed #8abf86; background: rgba(138, 191, 134, 0.05); }

        /* Сам виджет */
        .draggable-widget {
            background: linear-gradient(180deg, #101411 0%, #080a08 100%);
            border: 2px solid #283325;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8), inset 0 0 40px rgba(40, 51, 37, 0.2);
            transition: opacity 0.2s;
            overflow: hidden;
        }
        .draggable-widget.dragging { opacity: 0.4; }

        /* Шапка виджета */
        .widget-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #0b0d0a; border-bottom: 2px solid #283325;
            cursor: grab;
        }
        .widget-header:active { cursor: grabbing; }
        .widget-title { color: #829c73; font-weight: bold; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .drag-handle { color: #4a5c41; font-size: 18px; }
        .collapse-btn { background: none; border: none; color: #829c73; cursor: pointer; font-size: 18px; font-weight: bold; transition: color 0.2s; }
        .collapse-btn:hover { color: #c4d1b8; }

        /* Содержимое виджета */
        .widget-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        
        /* Свернутое состояние */
        .draggable-widget.collapsed { height: auto !important; flex: 0 0 auto; }
        .draggable-widget.collapsed .widget-content { display: none; }

        /* Отключаем клики по айфреймам при перетаскивании (чтобы не заедало) */
        body.is-dragging iframe { pointer-events: none !important; }

        /* СТИЛИ КОЛЕСА */
        .wheel-scaler { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 350px; }
        
        /* Авто-масштаб колеса, если оно в узкой колонке */
        .col-side .wheel-scaler { zoom: 0.65; }

        #wheel-wrapper { position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.8); transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none; }
        #wheel-wrapper.active { opacity: 1; transform: scale(1); }
        #wheel-canvas { position: absolute; width: 400px; height: 400px; top: 10px; left: 10px; border-radius: 50%; background-image: url('https://skinnystreams04-ai.github.io/auction-table/wheel/Wheel_Base.png'); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 1; }
        #wheel-frame { position: absolute; width: 420px; height: 420px; top: 0; left: 0; background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 5; filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.95)); }
        
        #wheel-wrapper.buff #wheel-frame { background-image: url('https://skinnystreams04-ai.github.io/auction-table/wheel/Frame_Buff.png'); }
        #wheel-wrapper.debuff #wheel-frame { background-image: url('https://skinnystreams04-ai.github.io/auction-table/wheel/Frame_Debuff.png'); }
        #wheel-wrapper.free #wheel-frame { background-image: url('https://skinnystreams04-ai.github.io/auction-table/wheel/Frame_Free.png'); }
        #wheel-wrapper.buff { filter: drop-shadow(0 0 50px rgba(94, 153, 64, 0.6)); } 
        #wheel-wrapper.debuff { filter: drop-shadow(0 0 60px rgba(163, 44, 44, 0.8)); } 
        #wheel-wrapper.free { filter: drop-shadow(0 0 50px rgba(150, 163, 140, 0.4)); } 

        .wheel-result { position: absolute; top: 110%; left: 50%; transform: translate(-50%, 0); text-align: center; opacity: 0; transition: opacity 0.3s; width: 100%; z-index: 10; font-family: 'Neucha', cursive, sans-serif;}
        .wheel-result.show { opacity: 1; }
        .res-user { color: #b8a87b; font-size: 24px; margin-bottom: 5px; text-shadow: 2px 2px 0px #000; line-height: 1;}
        .res-text { font-size: 32px; text-shadow: 3px 3px 0px #000; line-height: 1; font-weight: bold;}

        /* СТИЛИ АЛТАРЯ */
        #cauldron-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .cauldron-item { background: rgba(14, 17, 13, 0.8); border: 1px solid #21291f; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; flex-shrink: 0; }
        .c-top-row { display: flex; justify-content: space-between; align-items: center; }
        .c-game-name { font-size: 18px; font-weight: bold; color: #b5c4ab; text-transform: uppercase; width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px #000;}
        .c-tickets { font-size: 22px; font-weight: 900; color: #7fa86b; text-shadow: 0 0 8px rgba(127, 168, 107, 0.3); }
        .c-gold { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #b8a87b; font-weight: bold; background: rgba(140, 123, 82, 0.1); padding: 2px 6px; border-radius: 4px; width: fit-content; border: 1px solid rgba(140, 123, 82, 0.3); }
        .status-badge { font-size: 13px; font-family: sans-serif; font-weight: 900; padding: 3px 6px; border-radius: 4px; text-align: center; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        .cauldron-item.immortal { border-color: #3b5a59; background: linear-gradient(90deg, rgba(59, 90, 89, 0.2) 0%, rgba(14, 17, 13, 0.8) 100%); }
        .cauldron-item.immortal .c-game-name { color: #7fa6a3; }
        .status-badge.immortal { background: #1a2626; color: #7fa6a3; border: 1px solid #3b5a59; box-shadow: 0 0 10px rgba(59, 90, 89, 0.3); }
        .cauldron-item.absolute { border-color: #8c7b52; background: linear-gradient(90deg, rgba(140, 123, 82, 0.15) 0%, rgba(14, 17, 13, 0.8) 100%); }
        .cauldron-item.absolute .c-game-name { color: #b8a87b; }
        .status-badge.absolute { background: #2b2518; color: #b8a87b; border: 1px solid #8c7b52; box-shadow: 0 0 10px rgba(140, 123, 82, 0.3); }

        /* IFRAMES */
        .iframe-container { width: 100%; height: 100%; min-height: 250px; background: #000; border: none; }
    </style>
</head>
<body>

    <div class="layout">
        <!-- ФИКСИРОВАННАЯ ТАБЛИЦА -->
        <div class="left-panel" id="players-grid"></div>
        
        <!-- МОДУЛЬНАЯ ЗОНА -->
        <div class="right-interactive">
            
            <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА (ШИРОКАЯ) -->
            <div class="col-main">
                <!-- ЗОНА 1: КОЛЕСО -->
                <div class="drop-zone" id="zone-1" style="flex: 1;">
                    <div class="draggable-widget" id="widget-wheel" draggable="true">
                        <div class="widget-header">
                            <div class="widget-title"><span class="drag-handle">☰</span> 🎲 Колесо Скинволкера</div>
                            <button class="collapse-btn">➖</button>
                        </div>
                        <div class="widget-content">
                            <div class="wheel-scaler">
                                <div id="wheel-wrapper">
                                    <canvas id="wheel-canvas" width="800" height="800"></canvas>
                                    <div id="wheel-frame"></div>
                                    <div class="wheel-result" id="wheel-result">
                                        <div class="res-user" id="res-user">КРУТИТ: ЗРИТЕЛЬ</div>
                                        <div class="res-text" id="res-text">Награда!</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ЗОНА 2: ЧАТ -->
                <div class="drop-zone" id="zone-2" style="flex: 1;">
                    <div class="draggable-widget" id="widget-chat" draggable="true">
                        <div class="widget-header">
                            <div class="widget-title"><span class="drag-handle">☰</span> 💬 Чат Твича</div>
                            <button class="collapse-btn">➖</button>
                        </div>
                        <div class="widget-content">
                            <iframe class="iframe-container" src="https://www.twitch.tv/embed/skinwalker_nozxc/chat?parent=localhost&parent=127.0.0.1&parent=skinnystreams04-ai.github.io&darkpopout" frameborder="0" scrolling="no"></iframe>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА (УЗКАЯ) -->
            <div class="col-side">
                <!-- ЗОНА 3: АЛТАРЬ -->
                <div class="drop-zone" id="zone-3" style="flex: 1;">
                    <div class="draggable-widget" id="widget-altar" draggable="true">
                        <div class="widget-header">
                            <div class="widget-title"><span class="drag-handle">☰</span> 🩸 Жертвенный Алтарь</div>
                            <button class="collapse-btn">➖</button>
                        </div>
                        <div class="widget-content" id="cauldron-list">
                            <!-- Сюда генерятся игры -->
                        </div>
                    </div>
                </div>

                <!-- ЗОНА 4: СТРИМ -->
                <div class="drop-zone" id="zone-4" style="flex: 1;">
                    <div class="draggable-widget" id="widget-stream" draggable="true">
                        <div class="widget-header">
                            <div class="widget-title"><span class="drag-handle">☰</span> 📺 Стрим</div>
                            <button class="collapse-btn">➖</button>
                        </div>
                        <div class="widget-content">
                            <iframe class="iframe-container" src="https://player.twitch.tv/?channel=skinwalker_nozxc&parent=localhost&parent=127.0.0.1&parent=skinnystreams04-ai.github.io&muted=true" frameborder="0" allowfullscreen="true" scrolling="no"></iframe>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =========================================
        // ЛОГИКА DRAG & DROP И СВОРАЧИВАНИЯ
        // =========================================
        const widgets = document.querySelectorAll('.draggable-widget');
        const zones = document.querySelectorAll('.drop-zone');
        
        widgets.forEach(widget => {
            // Drag Start
            widget.addEventListener('dragstart', (e) => {
                widget.classList.add('dragging');
                e.dataTransfer.setData('text/plain', widget.id);
                document.body.classList.add('is-dragging'); // Отключаем клики по iframe
            });
            
            // Drag End
            widget.addEventListener('dragend', () => {
                widget.classList.remove('dragging');
                document.body.classList.remove('is-dragging');
                
                // Убираем подсветку со всех зон
                zones.forEach(z => z.classList.remove('drag-over'));
            });
        });

        zones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault(); // Разрешаем drop
                zone.classList.add('drag-over');
            });
            
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            
            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                
                const draggedId = e.dataTransfer.getData('text/plain');
                const draggedWidget = document.getElementById(draggedId);
                
                if (draggedWidget && draggedWidget.parentNode !== zone) {
                    // Магия обмена местами (Swap)
                    const existingWidget = zone.querySelector('.draggable-widget');
                    const originZone = draggedWidget.parentNode;
                    
                    if (existingWidget) {
                        originZone.appendChild(existingWidget);
                    }
                    zone.appendChild(draggedWidget);
                }
            });
        });

        // Сворачивание блоков
        document.querySelectorAll('.collapse-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const widget = e.target.closest('.draggable-widget');
                const zone = widget.parentElement;
                
                widget.classList.toggle('collapsed');
                
                if (widget.classList.contains('collapsed')) {
                    e.target.innerText = '➕';
                    zone.style.flex = '0 0 auto'; // Зона сжимается
                } else {
                    e.target.innerText = '➖';
                    zone.style.flex = '1'; // Зона растягивается обратно
                }
            });
        });

        // =========================================
        // ЛОГИКА АУКЦИОНА И БАЗЫ ДАННЫХ
        // =========================================
        const playersGrid = document.getElementById("players-grid");
        const cauldronList = document.getElementById("cauldron-list");
        const firebaseUrl = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/auction_data.json";
        const configUrl = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/auction_config.json";

        let dictionaryMap = {};
        let lastProcessedSpinTime = 0;
        let isSpinning = false;
        let currentConfig = null;
        let wheelTimeout = null;

        function copyNick(element, nick) {
            navigator.clipboard.writeText('@' + nick).then(() => {
                const originalText = element.innerText;
                element.innerText = "СКОПИРОВАНО!";
                element.style.color = "#8abf86";
                setTimeout(() => { element.innerText = originalText; element.style.color = ""; }, 1000);
            }).catch(err => { console.error("Ошибка копирования: ", err); });
        }

        async function fetchFromCloud() {
            try {
                const [dataRes, confRes] = await Promise.all([
                    fetch(firebaseUrl + "?nocache=" + new Date().getTime()),
                    fetch(configUrl + "?nocache=" + new Date().getTime())
                ]);
                
                const data = await dataRes.json();
                currentConfig = await confRes.json();
                
                if (currentConfig && currentConfig.dictionary) {
                    dictionaryMap = {};
                    if (currentConfig.dictionary.buffs) currentConfig.dictionary.buffs.forEach(e => dictionaryMap[e.id] = e);
                    if (currentConfig.dictionary.debuffs) currentConfig.dictionary.debuffs.forEach(e => dictionaryMap[e.id] = e);
                }

                if (data && data.players) {
                    try { drawSlots(data.players); } 
                    catch (e) { playersGrid.innerHTML = `<h3 style='color: #a32c2c;'>🔴 Ошибка: ${e.message}</h3>`; }
                } else {
                    playersGrid.innerHTML = "<h2 style='color: #4a5c41; text-align: center; width: 100%;'>Алтарь пуст... Ждем жертв.</h2>";
                    cauldronList.innerHTML = "";
                }

                if (data && data.last_spin && currentConfig && currentConfig.wheels) {
                    const spinData = data.last_spin;
                    if (spinData.timestamp > lastProcessedSpinTime && !isSpinning) {
                        lastProcessedSpinTime = spinData.timestamp;
                        startWheelAnimation(spinData);
                    }
                }
            } catch (error) { console.error("Ошибка связи:", error); }
        }

        setInterval(fetchFromCloud, 1000);
        fetchFromCloud();

        function drawSlots(playersData) {
            const globalCauldron = {};
            let globalMaxGames = 3; 

            playersData.forEach(player => {
                let playerTotalTickets = 0; 
                let localGameCount = 0;

                if (player.games) {
                    let gamesArr = Array.isArray(player.games) ? player.games : Object.values(player.games);
                    localGameCount = gamesArr.length;
                    
                    gamesArr.forEach(game => {
                        let safeName = game.name != null ? String(game.name) : "Без названия";
                        let upperName = safeName.toUpperCase();
                        let t = parseInt(game.tickets) || 0;
                        if (!globalCauldron[upperName]) globalCauldron[upperName] = { tickets: 0, gold: 0, rawName: safeName };
                        globalCauldron[upperName].tickets += t;
                        globalCauldron[upperName].gold += parseInt(game.gold) || 0; 
                        playerTotalTickets += t;
                    });
                }
                player.totalTickets = playerTotalTickets;
                if (localGameCount > globalMaxGames) globalMaxGames = localGameCount; 
            });

            playersData.sort((a, b) => b.totalTickets - a.totalTickets);
            
            let headerHtml = `<div class="table-header">
                <div class="th-user">ЗРИТЕЛЬ</div>
                <div class="th-games" style="grid-template-columns: repeat(${globalMaxGames}, 1fr);">`;
            
            for(let i = 1; i <= globalMaxGames; i++) {
                headerHtml += `<div class="th-game">ИГРА ${i}</div>`;
            }
            headerHtml += `</div></div>`;

            playersGrid.innerHTML = headerHtml;

            playersData.forEach(player => {
                let gamesHtml = "";
                
                if (player.games) {
                    let gamesArr = Array.isArray(player.games) ? player.games : Object.values(player.games);
                    gamesArr.forEach(game => {
                        let safeName = game.name != null ? String(game.name) : "Без названия";
                        let upperName = safeName.toUpperCase();
                        let globalGold = globalCauldron[upperName].gold;
                        let itemClass = "";
                        let globalBadge = "";

                        if (globalGold >= 20) { itemClass = "absolute-slot"; globalBadge = `<div class="badge absolute" title="Неуязвимость">🛡️</div>`; } 
                        else if (globalGold >= 10) { itemClass = "immortal-slot"; globalBadge = `<div class="badge immortal" title="Бессмертие">💀</div>`; }

                        let passiveBadge = "";
                        if (game.passive && game.passive > 0) passiveBadge = `<div class="badge passive" title="Пассивный доход">📈+${game.passive}</div>`;

                        let badgesArr = Array.isArray(game.badges) ? game.badges : Object.values(game.badges || {});
                        let localBadges = badgesArr.map(b => {
                            if (!b || !b.type) return "";
                            let iconText = "";
                            if (dictionaryMap[b.type]) iconText = `${dictionaryMap[b.type].icon}`;
                            else {
                                if(b.type === 'shield') iconText = "🛡️";
                                else if(b.type === 'fire') iconText = "🔥";
                                else if(b.type === 'freeze') iconText = "❄️";
                                else if(b.type === 'kill') iconText = "💀";
                                else iconText = `✨`; 
                            }
                            return `<div class="badge ${b.type}" title="${dictionaryMap[b.type] ? dictionaryMap[b.type].name : b.type}">${iconText}</div>`;
                        }).join("");
                        
                        let allBadges = globalBadge + localBadges;
                        
                        gamesHtml += `
                            <div class="pr-game-pill ${itemClass}">
                                <div class="pr-g-top">
                                    <div class="pr-g-name-wrap">
                                        <span class="pr-g-name" title="${safeName}">${safeName}</span>
                                    </div>
                                    <span class="pr-g-tix">🎟️ ${game.tickets || 0}</span>
                                </div>
                                <div class="pr-g-bottom">
                                    <div class="badges-mini-container">${allBadges}</div>
                                    <div class="passive-container">${passiveBadge}</div>
                                </div>
                            </div>
                        `;
                    });
                }

                playersGrid.innerHTML += `
                    <div class="player-row">
                        <div class="pr-user-info">
                            <div class="pr-role-name">
                                <span class="role-badge ${player.role ? player.role.toLowerCase() : 'f'}">${player.role || 'F'}</span>
                                <span class="pr-name" title="Кликни чтобы скопировать ник" onclick="copyNick(this, '${player.user || "Зритель"}')">${player.user || "Зритель"}</span>
                            </div>
                            <div class="pr-total">Σ ${player.totalTickets} билетов</div>
                        </div>
                        <div class="pr-games" style="grid-template-columns: repeat(${globalMaxGames}, 1fr);">
                            ${gamesHtml}
                        </div>
                    </div>
                `;
            });

            const sortedGames = Object.values(globalCauldron).sort((a, b) => b.tickets - a.tickets);
            cauldronList.innerHTML = "";
            sortedGames.forEach(game => {
                let statusBadge = ""; let itemClass = "";
                if (game.gold >= 20) { itemClass = "absolute"; statusBadge = `<div class="status-badge absolute">🛡️ НЕУЯЗВИМОСТЬ</div>`; } 
                else if (game.gold >= 10) { itemClass = "immortal"; statusBadge = `<div class="status-badge immortal">💀 БЕССМЕРТИЕ</div>`; }

                cauldronList.innerHTML += `
                    <div class="cauldron-item ${itemClass}">
                        <div class="c-top-row"><div class="c-game-name" title="${game.rawName}">${game.rawName}</div><div class="c-tickets">🎟️ ${game.tickets}</div></div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                            ${game.gold > 0 ? `<div class="c-gold">⚜️ Золото: ${game.gold}</div>` : '<div></div>'}
                            ${statusBadge}
                        </div>
                    </div>
                `;
            });
        }

        function startWheelAnimation(spinData) {
            isSpinning = true;
            const wrapper = document.getElementById('wheel-wrapper');
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            const resultBox = document.getElementById('wheel-result');
            const resText = document.getElementById('res-text');
            
            resultBox.classList.remove('show');
            wrapper.className = 'active'; 
            canvas.style.transform = `rotate(0rad)`;

            let itemsRaw = [];
            let neonColor = "#8abf86"; 
            
            if (spinData.action === "SPIN_BUFF_SUB") {
                itemsRaw = currentConfig.wheels.premium.buffs;
                wrapper.classList.add('buff');
                neonColor = "#8abf86"; 
            } else if (spinData.action === "SPIN_DEBUFF_SUB") {
                itemsRaw = currentConfig.wheels.premium.debuffs;
                wrapper.classList.add('debuff');
                neonColor = "#c45c5c"; 
            } else if (spinData.action === "SPIN_FREE_WHEEL") {
                itemsRaw = currentConfig.wheels.free.buffs;
                wrapper.classList.add('free');
                neonColor = "#b0b8a8"; 
            }
            
            resText.style.color = neonColor;

            const activeItems = itemsRaw.filter(i => i.active);
            if (activeItems.length === 0) { isSpinning = false; wrapper.className = ''; return; }

            const targetIndex = spinData.index; 
            const targetItem = activeItems[targetIndex];
            
            const cx = 400, cy = 400;
            const sliceAngle = (Math.PI * 2) / activeItems.length;

            ctx.clearRect(0, 0, 800, 800);
            const lineRadius = 400; 
            const textRadius = 265; 

            for (let i = 0; i < activeItems.length; i++) {
                const startA = i * sliceAngle;
                const endA = startA + sliceAngle;
                
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, lineRadius, startA, endA);
                ctx.closePath();
                ctx.strokeStyle = "rgba(0, 0, 0, 0.8)"; 
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startA + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                let text = activeItems[i].name;
                if(text.length > 18) text = text.substring(0, 16) + "...";
                
                ctx.font = "bold 32px 'Neucha', cursive, sans-serif"; 
                
                ctx.lineWidth = 6; 
                ctx.strokeStyle = "black";
                ctx.strokeText(text, textRadius, 0);

                ctx.fillStyle = neonColor; 
                ctx.shadowBlur = 0; 
                ctx.fillText(text, textRadius, 0); 
                
                ctx.restore();
            }

            const spins = 5;
            const targetCenterAngle = targetIndex * sliceAngle + (sliceAngle / 2);
            const finalAngle = (spins * Math.PI * 2) - (Math.PI / 2) - targetCenterAngle;
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.7); 
            const absoluteFinalAngle = finalAngle + randomOffset;

            let startTime = null;
            const duration = (currentConfig.wheels.spin_duration || 5) * 1000;

            function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

            function animateWheel(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                const currentAngle = absoluteFinalAngle * easeOut(progress);
                canvas.style.transform = `rotate(${currentAngle}rad)`;

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    document.getElementById('res-user').innerText = `КРУТИТ: ${spinData.user}`;
                    document.getElementById('res-text').innerText = `Награда: ${targetItem.name}`;
                    resultBox.classList.add('show');
                    
                    clearTimeout(wheelTimeout);
                    wheelTimeout = setTimeout(() => {
                        wrapper.classList.remove('active');
                        setTimeout(() => { isSpinning = false; }, 500); 
                    }, duration);
                }
            }
            
            requestAnimationFrame(animateWheel);
        }
    </script>
</body>
