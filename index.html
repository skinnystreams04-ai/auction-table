<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аукцион - Оверлей OBS V3.1 (Бронебойный)</title>
    <style>
        /* Глубокий мрак на фоне (в OBS будет прозрачным) */
        body { margin: 0; padding: 20px; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif; overflow: hidden; background-color: #050605; color: #c2c9bc; }
        
        .layout { display: flex; gap: 20px; align-items: flex-start; height: 95vh; width: 100%; justify-content: space-between; }
        
        .left-panel { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; align-content: start; overflow-y: auto; padding-right: 10px; max-height: 100%; }
        .center-panel { flex: 0 0 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 100%; }
        
        .right-panel { flex: 0 0 350px; background: linear-gradient(180deg, #140d0d 0%, #070a07 100%); border: 2px solid #4a1515; border-radius: 6px; padding: 15px; box-shadow: -10px 0 30px rgba(0,0,0,0.9), inset 0 0 40px rgba(74, 21, 21, 0.4); display: flex; flex-direction: column; gap: 10px; max-height: 100%; box-sizing: border-box; }
        .cauldron-header { font-size: 20px; font-weight: 900; color: #8c9c84; text-align: center; text-transform: uppercase; border-bottom: 2px solid #4a1515; padding-bottom: 10px; letter-spacing: 2px; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); flex-shrink: 0; }
        #cauldron-list { overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }

        .left-panel::-webkit-scrollbar, #cauldron-list::-webkit-scrollbar { width: 6px; }
        .left-panel::-webkit-scrollbar-track, #cauldron-list::-webkit-scrollbar-track { background: rgba(10, 14, 10, 0.5); border-radius: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: #263327; border-radius: 4px; }
        #cauldron-list::-webkit-scrollbar-thumb { background: #4a1515; border-radius: 4px; }

        .cauldron-item { background: rgba(8, 12, 8, 0.8); border: 1px solid #1c261c; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; flex-shrink: 0; }
        .c-top-row { display: flex; justify-content: space-between; align-items: center; }
        .c-game-name { font-size: 15px; font-weight: bold; color: #b0bcab; text-transform: uppercase; width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .c-tickets { font-size: 20px; font-weight: 900; color: #7fa86b; text-shadow: 0 0 8px rgba(127, 168, 107, 0.3); }
        .c-gold { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #b59a5c; font-weight: bold; background: rgba(181, 154, 92, 0.1); padding: 2px 6px; border-radius: 4px; width: fit-content; border: 1px solid rgba(181, 154, 92, 0.3); }

        .status-badge { font-size: 11px; font-weight: 900; padding: 3px 6px; border-radius: 4px; text-align: center; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        .cauldron-item.immortal, .game-item.immortal-slot { border-color: #4a6b82; background: linear-gradient(90deg, rgba(74, 107, 130, 0.2) 0%, rgba(5, 7, 5, 0.8) 100%); }
        .cauldron-item.immortal .c-game-name, .game-item.immortal-slot .game-name { color: #8cb4d1; text-shadow: 0 0 8px rgba(140, 180, 209, 0.4); }
        .status-badge.immortal, .badge.immortal { background: #14202b; color: #8cb4d1; border: 1px solid #4a6b82; box-shadow: 0 0 10px rgba(74, 107, 130, 0.4); }

        .cauldron-item.absolute, .game-item.absolute-slot { border-color: #b59a5c; background: linear-gradient(90deg, rgba(181, 154, 92, 0.15) 0%, rgba(5, 7, 5, 0.8) 100%); box-shadow: 0 0 15px rgba(181, 154, 92, 0.1); }
        .cauldron-item.absolute .c-game-name, .game-item.absolute-slot .game-name { color: #d4c194; text-shadow: 0 0 10px rgba(212, 193, 148, 0.4); }
        .status-badge.absolute, .badge.absolute { background: #3d3119; color: #d4c194; border: 1px solid #b59a5c; text-shadow: 0 0 5px rgba(212, 193, 148, 0.8); box-shadow: 0 0 10px rgba(181, 154, 92, 0.4); }

        .user-card { background: linear-gradient(145deg, #101410 0%, #080606 100%); border: 2px solid #3b1717; border-radius: 4px; padding: 12px; box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 10px 20px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 10px; color: #b0bcab; flex-shrink: 0; }
        .user-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e1414; padding-bottom: 8px; }
        .user-header-left { display: flex; align-items: center; gap: 8px; }
        .role-badge { font-size: 10px; font-weight: 900; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 5px rgba(0,0,0,0.8); color: #e0e0e0; }
        .role-badge.sub { background: #4a2b54; border: 1px solid #6c417a; } 
        .role-badge.vip { background: #5e1c34; border: 1px solid #8a2a4d; } 
        .role-badge.f   { background: #263327; border: 1px solid #3a4d3b; } 
        .username { font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #d1d6cd; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
        .user-total-tickets { font-size: 14px; font-weight: bold; color: #7fa86b; background: rgba(127, 168, 107, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(127, 168, 107, 0.3); }
        
        .game-item { background: rgba(5, 7, 5, 0.8); border: 1px solid #1a211a; border-radius: 2px; padding: 8px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid #5e1a1a; }
        .game-top-row { display: flex; justify-content: space-between; align-items: center; }
        
        .game-name-container { display: flex; align-items: center; gap: 6px; max-width: 70%; }
        .game-number { color: #89b4fa; font-weight: 900; font-size: 14px; text-shadow: 0 0 5px rgba(137, 180, 250, 0.4); }
        .game-name { font-size: 13px; font-weight: bold; color: #94a38f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
        .tickets { font-size: 22px; font-weight: 900; color: #7fa86b; line-height: 1; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); }
        
        .badges-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .badge { padding: 2px 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; background: rgba(5,5,5,0.9); border: 1px solid; border-radius: 2px; box-shadow: inset 0 0 5px rgba(0,0,0,0.9); }
        .badge.freeze { color: #5a7b8c; border-color: #314652; } 
        .badge.shield { color: #8c8163; border-color: #524b38; } 
        .badge.fire   { color: #d97736; border-color: #8c4217; } 
        .badge.passive { color: #a6e3a1; border-color: #436340; background: rgba(166, 227, 161, 0.1); } 

        /* 🔥 СТИЛИ ЖИВОГО КОЛЕСА (PNG + НЕОН) 🔥 */
        #wheel-wrapper { position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease; transform: scale(0.8); pointer-events: none; }
        #wheel-wrapper.active { opacity: 1; transform: scale(1); }
        
        .wheel-pointer { display: none; }
        
        canvas { 
            width: 400px; 
            height: 400px; 
            border-radius: 50%; 
            border: none; 
            background-position: center;
            background-size: auto 100%; 
            background-repeat: no-repeat;
            background-color: transparent;
        }
        
        .wheel-result { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 6, 5, 0.95); border: 2px solid #8c9c84; padding: 15px 25px; border-radius: 8px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.3s; width: 80%; }
        .wheel-result.show { opacity: 1; }
        .res-user { color: #d4c194; font-size: 18px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase;}
        .res-text { color: #fff; font-size: 22px; font-weight: 900; text-shadow: 0 0 10px rgba(255,255,255,0.4); }

        #wheel-wrapper.buff canvas { background-image: url('Buff.png'); box-shadow: 0 0 70px rgba(0, 255, 0, 0.3); }
        #wheel-wrapper.debuff canvas { background-image: url('Debuff.png'); box-shadow: 0 0 70px rgba(255, 0, 0, 0.4); }
        #wheel-wrapper.free canvas { background-image: url('Free.png'); box-shadow: 0 0 70px rgba(100, 150, 255, 0.3); }
    </style>
</head>
<body>

    <div class="layout">
        <div class="left-panel" id="players-grid"></div>
        
        <div class="center-panel">
            <div id="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <canvas id="wheel-canvas" width="800" height="800"></canvas>
                <div class="wheel-result" id="wheel-result">
                    <div class="res-user" id="res-user">Зритель</div>
                    <div class="res-text" id="res-text">✨ Награда!</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="cauldron-header">🪦 Жертвенный Алтарь</div>
            <div id="cauldron-list"></div>
        </div>
    </div>

    <script>
        const playersGrid = document.getElementById("players-grid");
        const cauldronList = document.getElementById("cauldron-list");
        const firebaseUrl = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/auction_data.json";
        const configUrl = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/auction_config.json";

        let dictionaryMap = {};
        let lastProcessedSpinTime = 0;
        let isSpinning = false;
        let currentConfig = null;
        let wheelTimeout = null;

        async function fetchFromCloud() {
            try {
                const [dataRes, confRes] = await Promise.all([
                    fetch(firebaseUrl + "?nocache=" + new Date().getTime()),
                    fetch(configUrl + "?nocache=" + new Date().getTime())
                ]);
                
                const data = await dataRes.json();
                currentConfig = await confRes.json();
                
                if (currentConfig && currentConfig.dictionary) {
                    dictionaryMap = {};
                    if (currentConfig.dictionary.buffs) currentConfig.dictionary.buffs.forEach(e => dictionaryMap[e.id] = e);
                    if (currentConfig.dictionary.debuffs) currentConfig.dictionary.debuffs.forEach(e => dictionaryMap[e.id] = e);
                }

                if (data && data.players) {
                    try {
                        drawSlots(data.players);
                    } catch (e) {
                        console.error("КРИТИЧЕСКАЯ ОШИБКА ОТРИСОВКИ:", e);
                        playersGrid.innerHTML = `<h3 style='color: #f38ba8;'>🔴 Ошибка в данных БД: ${e.message}</h3>`;
                    }
                } else {
                    playersGrid.innerHTML = "<h2 style='color: #4a1515;'>Алтарь пуст... Ждем жертв.</h2>";
                    cauldronList.innerHTML = "";
                }

                if (data && data.last_spin && currentConfig && currentConfig.wheels) {
                    const spinData = data.last_spin;
                    if (spinData.timestamp > lastProcessedSpinTime && !isSpinning) {
                        lastProcessedSpinTime = spinData.timestamp;
                        startWheelAnimation(spinData);
                    }
                }

            } catch (error) { console.error("Ошибка связи с Некрополем:", error); }
        }

        setInterval(fetchFromCloud, 1000);
        fetchFromCloud();

        // 🔥 ЗАЩИЩЕННАЯ ФУНКЦИЯ ОТРИСОВКИ 🔥
        function drawSlots(playersData) {
            const globalCauldron = {};
            
            // 1. ПЕРВЫЙ ПРОХОД: Считаем билеты и защищаемся от кривых имен
            playersData.forEach(player => {
                let playerTotalTickets = 0; 
                if (player.games) {
                    let gamesArr = Array.isArray(player.games) ? player.games : Object.values(player.games);
                    gamesArr.forEach(game => {
                        // Бронебойная защита: превращаем что угодно в текст
                        let safeName = game.name != null ? String(game.name) : "Без названия";
                        let upperName = safeName.toUpperCase();
                        let t = parseInt(game.tickets) || 0;
                        
                        if (!globalCauldron[upperName]) {
                            globalCauldron[upperName] = { tickets: 0, gold: 0, rawName: safeName };
                        }
                        globalCauldron[upperName].tickets += t;
                        globalCauldron[upperName].gold += parseInt(game.gold) || 0; 
                        
                        playerTotalTickets += t;
                    });
                }
                player.totalTickets = playerTotalTickets;
            });

            playersData.sort((a, b) => b.totalTickets - a.totalTickets);
            playersGrid.innerHTML = "";

            playersData.forEach(player => {
                let gamesHtml = "";
                let localGameCounter = 1; 
                
                if (player.games) {
                    let gamesArr = Array.isArray(player.games) ? player.games : Object.values(player.games);
                    gamesArr.forEach(game => {
                        let safeName = game.name != null ? String(game.name) : "Без названия";
                        let upperName = safeName.toUpperCase();
                        let globalGold = globalCauldron[upperName].gold;
                        
                        let itemClass = "";
                        let globalBadge = "";

                        if (globalGold >= 20) {
                            itemClass = "absolute-slot"; globalBadge = `<div class="badge absolute">🛡️ НЕУЯЗВИМОСТЬ</div>`;
                        } else if (globalGold >= 10) {
                            itemClass = "immortal-slot"; globalBadge = `<div class="badge immortal">💀 БЕССМЕРТИЕ</div>`;
                        }

                        let passiveBadge = "";
                        if (game.passive && game.passive > 0) passiveBadge = `<div class="badge passive">📈 +${game.passive}</div>`;

                        let badgesArr = Array.isArray(game.badges) ? game.badges : Object.values(game.badges || {});
                        let localBadges = badgesArr.map(b => {
                            if (!b || !b.type) return "";
                            let iconText = "";
                            if (dictionaryMap[b.type]) {
                                iconText = `${dictionaryMap[b.type].icon} ${dictionaryMap[b.type].name}`;
                            } else {
                                if(b.type === 'shield') iconText = "🛡️ Щит";
                                else if(b.type === 'fire') iconText = "🔥 Огонь";
                                else if(b.type === 'freeze') iconText = "❄️ Заморозка";
                                else if(b.type === 'kill') iconText = "💀 УБИТ";
                                else iconText = `✨ ${b.type}`; 
                            }
                            return `<div class="badge ${b.type}">${iconText}</div>`;
                        }).join("");
                        
                        let badgesHtml = globalBadge + passiveBadge + localBadges;
                        
                        gamesHtml += `
                            <div class="game-item ${itemClass}">
                                <div class="game-top-row">
                                    <div class="game-name-container">
                                        <span class="game-number">#${localGameCounter}</span>
                                        <span class="game-name">${safeName}</span>
                                    </div>
                                    <div class="tickets">🎟️ ${game.tickets || 0}</div>
                                </div>
                                ${badgesHtml ? `<div class="badges-container">${badgesHtml}</div>` : ''}
                            </div>
                        `;
                        localGameCounter++; 
                    });
                }

                playersGrid.innerHTML += `
                    <div class="user-card">
                        <div class="user-header">
                            <div class="user-header-left">
                                <span class="role-badge ${player.role ? player.role.toLowerCase() : 'f'}">${player.role || 'F'}</span>
                                <span class="username">${player.user || "Зритель"}</span>
                            </div>
                            <div class="user-total-tickets">Σ ${player.totalTickets}</div>
                        </div>
                        ${gamesHtml}
                    </div>
                `;
            });

            const sortedGames = Object.values(globalCauldron).sort((a, b) => b.tickets - a.tickets);
            cauldronList.innerHTML = "";
            sortedGames.forEach(game => {
                let statusBadge = ""; let itemClass = "";
                if (game.gold >= 20) { itemClass = "absolute"; statusBadge = `<div class="status-badge absolute">🛡️ НЕУЯЗВИМОСТЬ</div>`; } 
                else if (game.gold >= 10) { itemClass = "immortal"; statusBadge = `<div class="status-badge immortal">💀 БЕССМЕРТИЕ</div>`; }

                cauldronList.innerHTML += `
                    <div class="cauldron-item ${itemClass}">
                        <div class="c-top-row">
                            <div class="c-game-name">${game.rawName}</div>
                            <div class="c-tickets">🎟️ ${game.tickets}</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                            ${game.gold > 0 ? `<div class="c-gold">⚜️ Золото: ${game.gold}</div>` : '<div></div>'}
                            ${statusBadge}
                        </div>
                    </div>
                `;
            });
        }

        function startWheelAnimation(spinData) {
            isSpinning = true;
            const wrapper = document.getElementById('wheel-wrapper');
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            const resultBox = document.getElementById('wheel-result');
            
            resultBox.classList.remove('show');
            wrapper.className = 'active'; 

            let itemsRaw = [];
            let neonColor = "#00ff00"; 
            
            if (spinData.action === "SPIN_BUFF_SUB") {
                itemsRaw = currentConfig.wheels.premium.buffs;
                wrapper.classList.add('buff');
                neonColor = "#00ff00";
            } else if (spinData.action === "SPIN_DEBUFF_SUB") {
                itemsRaw = currentConfig.wheels.premium.debuffs;
                wrapper.classList.add('debuff');
                neonColor = "#ff0000";
            } else if (spinData.action === "SPIN_FREE_WHEEL") {
                itemsRaw = currentConfig.wheels.free.buffs;
                wrapper.classList.add('free');
                neonColor = "#00aaff";
            }

            const activeItems = itemsRaw.filter(i => i.active);
            if (activeItems.length === 0) { isSpinning = false; wrapper.className = ''; return; }

            const targetIndex = spinData.index; 
            const targetItem = activeItems[targetIndex];
            
            const cx = 400, cy = 400, r = 380;
            const sliceAngle = (Math.PI * 2) / activeItems.length;

            let currentAngle = 0;
            const spins = 5;
            const targetCenterAngle = targetIndex * sliceAngle + (sliceAngle / 2);
            const finalAngle = (spins * Math.PI * 2) + (Math.PI * 1.5) - targetCenterAngle;
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.7); 
            const absoluteFinalAngle = finalAngle + randomOffset;

            let startTime = null;
            const duration = 5000; 

            function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

            function drawFrame(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                currentAngle = absoluteFinalAngle * easeOut(progress);

                ctx.clearRect(0, 0, 800, 800);
                
                for (let i = 0; i < activeItems.length; i++) {
                    const startA = currentAngle + i * sliceAngle;
                    const endA = startA + sliceAngle;
                    
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, startA, endA);
                    ctx.closePath();
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.5)"; 
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(startA + sliceAngle / 2);
                    ctx.textAlign = "right";
                    ctx.textBaseline = "middle";
                    
                    ctx.fillStyle = neonColor; 
                    ctx.shadowColor = neonColor;
                    ctx.shadowBlur = 20;
                    ctx.font = "bold 32px 'Trebuchet MS', sans-serif"; 
                    
                    let text = activeItems[i].name;
                    if(text.length > 18) text = text.substring(0, 16) + "...";
                    
                    ctx.fillText(text, r - 60, 0); 
                    ctx.restore();
                }

                if (progress < 1) {
                    requestAnimationFrame(drawFrame);
                } else {
                    document.getElementById('res-user').innerText = spinData.user;
                    document.getElementById('res-text').innerText = targetItem.name;
                    resultBox.classList.add('show');
                    
                    clearTimeout(wheelTimeout);
                    wheelTimeout = setTimeout(() => {
                        wrapper.classList.remove('active');
                        setTimeout(() => { isSpinning = false; }, 500); 
                    }, 5000);
                }
            }

            requestAnimationFrame(drawFrame);
        }
    </script>
</body>
</html>
